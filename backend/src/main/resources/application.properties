spring.application.name=trainhere-backend

spring.datasource.url=${TRAINHERE_DB_URL:jdbc:postgresql://localhost:5432/trainhere}
spring.datasource.username=${TRAINHERE_DB_USERNAME:trainhere}
spring.datasource.password=${TRAINHERE_DB_PASSWORD:trainhere}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=${TRAINHERE_FLYWAY_LOCATIONS:classpath:db/migration}
spring.flyway.ignore-migration-patterns=*:future,repeatable:missing

app.jwt.secret=${TRAINHERE_JWT_SECRET:trainhere-local-development-secret-key-change-me-before-production}
app.jwt.expiration-ms=${TRAINHERE_JWT_EXPIRATION_MS:86400000}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
